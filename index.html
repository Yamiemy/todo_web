<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>

<body>

    <!-- ================= NAVIGATION ================= -->
<div class="container_box">
    <nav class="header">
        <div class="header-content">
            <div class="logo-box">
                <span class="material-symbols-outlined">check</span>
            </div>
            <div class="title-area">
                <h1>To-Do List App</h1>
                <h3>Plan • Focus • Get Things Done</h3>
            </div>
            <span class="material-symbols-outlined header-icon">assignment</span>
        </div>

    </nav>

    <!-- ================= MAIN ================= -->

    <main class="container">
        <section class="input-card">
            <div class="input-row">
                <div class="input-box">
                    <span class="material-symbols-outlined input-icon">edit </span>
                    <input type="text"id="taskInput" placeholder="Write your task here..." autocomplete="off">
                </div>
                <button class="add-btn" id="addBtn">
                    <span class="material-symbols-outlined">add</span>
                    <span>Add Task</span>
                </button>
            </div>
            <div class="action-row">
                <button class="clear-btn clear-all" id="clearAllBtn">
                  <span class="material-symbols-outlined">delete</span>
                  <span>Clear All Tasks</span>
                </button>
               <button class="clear-btn clear-completed" id="clearCompletedBtn">
                  <span class="material-symbols-outlined">check_circle  </span>
                    <span>Clear Completed Tasks</span>
                </button>
            </div>
        </section>
      
        <section class="task-section">
            <div id="taskList"></div>
            <div class="empty-state" id="emptyState">
                <div class="empty-illustration">
                    <img src="task.png" alt="task">
                </div>
                <h2>You have nothing task today!</h2>
                <p>Enter your tasks today above.</p>
            </div>
        </section>
    </main>
    </div>

    <script src="script.js"></script>

</body>
</html>
